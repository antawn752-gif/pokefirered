name: Build ROM

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y libpng-dev build-essential curl

      - name: Download ROM base
        run: |
          curl -L -o rom.gba "https://archive.org"

      - name: Compile game
        run: |
          make -j$(nproc)
          
      - name: Upload finished ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-FireRed-Custom
          path: pokefirered.gba

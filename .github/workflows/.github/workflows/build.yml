name: Build ROM

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pret/pokefirered-build:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ROM base
        run: |
          curl -L -o rom.gba "https://archive.org"

      - name: Build Tools
        run: |
          make -C tools/gflib
          make -C tools/scaninc
          make -C tools/preproc
          make -C tools/gbagfx

      - name: Compile game
        run: |
          make -j$(nproc)
          
      - name: Upload finished ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-FireRed-Custom
          path: pokefirered.gba

name: Build ROM

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev build-essential curl git gd-map gcc-arm-none-eabi

      - name: Install agbcc
        run: |
          # The game code relies on an older internal compiler called agbcc
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ../
          cd ..

      - name: Download ROM base
        run: |
          curl -L -o rom.gba "https://archive.org"

      - name: Compile game
        run: |
          make -j$(nproc)
          
      - name: Upload finished ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-FireRed-Custom
          path: pokefirered.gba
